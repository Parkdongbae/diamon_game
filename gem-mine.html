<title>보석 광산</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-column game screen — stat strip, square board, control row. Single committed dark "mine" look. */
:root{
  --bg:#0c0a16;
  --panel:#171429;
  --line:#2a2548;
  --fg:#f4f0ff;
  --muted:#9d95c9;
  --gold:#ffcf3d;
  --warn:#ff6b6b;
  --font-display:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --font-body:"Gowun Dodum","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:radial-gradient(120% 80% at 50% 0%,#1d1838 0%,var(--bg) 60%) fixed,var(--bg);
  color:var(--fg);font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box;
  display:flex;justify-content:center;
}
.wrap{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:1.9rem;margin:0;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff6c4,var(--gold) 55%,#d38a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:.72rem;color:var(--muted);letter-spacing:.08em}
.stat b{font-family:var(--font-display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat.low b{color:var(--warn)}
.stat.score b{color:var(--gold)}
.board-wrap{position:relative;width:100%;aspect-ratio:1;max-width:100%}
canvas{display:block;width:100%;height:100%;border-radius:14px;background:#120f22;
  box-shadow:0 0 0 1px var(--line),0 20px 50px rgba(0,0,0,.55);touch-action:none;cursor:pointer;outline:none}
canvas:focus-visible{box-shadow:0 0 0 3px var(--gold),0 20px 50px rgba(0,0,0,.55)}
.combo{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);pointer-events:none;opacity:0;
  font-family:var(--font-display);font-size:2.6rem;color:var(--gold);white-space:nowrap;
  text-shadow:0 3px 0 #7a4a00,0 0 24px rgba(255,207,61,.6)}
.combo.show{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:var(--font-display);font-size:1rem;color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:10px 16px;cursor:pointer;transition:transform .1s,border-color .15s}
button:hover{border-color:var(--muted)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:linear-gradient(180deg,#ffd95a,#e9a400);color:#3a2400;border-color:#c98a00}
.controls .grow{flex:1}
.help{color:var(--muted);font-size:.85rem;line-height:1.5;margin:0}
.over{position:absolute;inset:0;border-radius:14px;background:rgba(10,8,20,.82);backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.over h2{font-family:var(--font-display);font-weight:400;font-size:2.2rem;margin:0;color:var(--gold)}
.over p{margin:0;color:var(--muted)}
.over .big{font-family:var(--font-display);font-size:3rem;color:var(--fg);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.combo.show{animation-duration:.01s}}
</style>

<div class="wrap">
  <header>
    <h1>보석 광산</h1>
    <span class="sub">같은 보석을 한 줄에 3개, 또는 2×2로 모으세요</span>
  </header>

  <div class="stats">
    <div class="stat score"><span>점수</span><b id="score">0</b></div>
    <div class="stat" id="movesBox"><span>남은 이동</span><b id="moves">30</b></div>
    <div class="stat"><span>최고 기록</span><b id="best">0</b></div>
  </div>

  <div class="board-wrap">
    <canvas id="board" tabindex="0" aria-label="8×8 보석 게임판. 방향키로 이동, Enter로 선택 후 방향키로 교환"></canvas>
    <div class="combo" id="combo"></div>
    <div class="over" id="over" hidden>
      <h2>게임 종료</h2>
      <div class="big" id="finalScore">0</div>
      <p id="finalMsg">이동 횟수를 모두 사용했어요</p>
      <button class="primary" id="againBtn">다시 하기</button>
    </div>
  </div>

  <div class="controls">
    <button id="hintBtn">힌트</button>
    <button id="soundBtn" aria-pressed="true">소리 켜짐</button>
    <span class="grow"></span>
    <button class="primary" id="newBtn">새 게임</button>
  </div>
  <p class="help">보석을 옆 칸으로 끌거나, 두 보석을 차례로 눌러 자리를 바꿉니다. 같은 보석이 2×2 정사각형으로 모여도 부서집니다. 4개를 맞추면 +40, 5개 이상은 +120 보너스, 연쇄 콤보마다 점수가 배로 올라갑니다.</p>
</div>

<script>
(() => {
const N = 8, T = 6, START_MOVES = 30;
const COLORS = [
  {light:'#ffb3b3', mid:'#e8323a', dark:'#8e0f18', edge:'#4f060b'}, // 루비
  {light:'#c4ffad', mid:'#2fb52a', dark:'#0f6410', edge:'#073807'}, // 에메랄드
  {light:'#d2e8ff', mid:'#3a86f0', dark:'#153f9a', edge:'#0a2259'}, // 사파이어
  {light:'#ffd8f5', mid:'#ee6fd0', dark:'#a3318a', edge:'#5a144c'}, // 핑크 다이아
  {light:'#fff5b8', mid:'#ffc21a', dark:'#c27400', edge:'#653a00'}, // 토파즈
  {light:'#f2e0ff', mid:'#a24ee6', dark:'#561a8e', edge:'#2e0e4a'}, // 자수정
];

const cv = document.getElementById('board'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let S = 60, W = 480, dpr = 1, sprites = [];

let grid = [], dying = [], particles = [], floats = [];
let score = 0, moves = START_MOVES, best = 0, busy = false, over = false;
let sel = null, hint = null, idle = 0, kb = null;
let waiters = [];

try { best = +localStorage.getItem('gemmine-best') || 0; } catch (e) {}

/* ---------- 보석 그리기 ---------- */
function poly(n, rot, r = 1) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = rot + i * 2 * Math.PI / n; p.push([Math.cos(a) * r, Math.sin(a) * r]); }
  return p;
}
function shape(t) {
  switch (t) {
    case 0: return {pts: poly(4, -Math.PI / 2, .98), c: [0, 0], k: .5};
    case 1: return {pts: [[0, -.92], [.98, .78], [-.98, .78]], c: [0, .22], k: .42, dy: -.12};
    case 2: return {pts: [[-.55, -.72], [.55, -.72], [.95, -.18], [0, .95], [-.95, -.18]], c: [0, -.3], k: .5};
    case 3: return {pts: poly(8, Math.PI / 8, .97), c: [0, 0], k: .55};
    case 4: return {pts: poly(6, 0, .97), c: [0, 0], k: .52};
    case 5: return {pts: poly(8, Math.PI / 8, .95), c: [0, 0], k: .5, round: true};
  }
}
function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
function path(g, P) { g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }

function drawGem(g, t, cx, cy, R) {
  const col = COLORS[t], s = shape(t), dy = (s.dy || 0) * R;
  const P = s.pts.map(([x, y]) => [cx + x * R, cy + y * R + dy]);
  const C = [cx + s.c[0] * R, cy + s.c[1] * R + dy];
  const I = P.map(([x, y]) => [C[0] + (x - C[0]) * s.k, C[1] + (y - C[1]) * s.k]);

  // 그림자 + 바탕
  g.save();
  g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = R * .25; g.shadowOffsetY = R * .1;
  path(g, P); g.fillStyle = col.dark; g.fill();
  g.restore();

  // 면 (빛은 왼쪽 위에서)
  const L = [-.55, -.83];
  for (let i = 0; i < P.length; i++) {
    const a = P[i], b = P[(i + 1) % P.length], ia = I[i], ib = I[(i + 1) % P.length];
    let nx = (a[0] + b[0]) / 2 - C[0], ny = (a[1] + b[1]) / 2 - C[1];
    const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
    const l = (nx * L[0] + ny * L[1] + 1) / 2;
    g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...ib); g.lineTo(...ia); g.closePath();
    g.fillStyle = l > .5 ? mix(col.mid, col.light, (l - .5) * 1.6) : mix(col.dark, col.mid, l * 2);
    g.fill();
  }
  // 윗면
  const yTop = Math.min(...I.map(p => p[1])), yBot = Math.max(...I.map(p => p[1]));
  const grd = g.createLinearGradient(0, yTop, 0, yBot);
  grd.addColorStop(0, col.light); grd.addColorStop(1, col.mid);
  path(g, I); g.fillStyle = grd; g.fill();

  if (s.round) {
    const rg = g.createRadialGradient(C[0] - R * .1, C[1] - R * .12, 0, C[0], C[1], R * .48);
    rg.addColorStop(0, '#ffffff'); rg.addColorStop(.45, col.light); rg.addColorStop(1, col.mid);
    g.beginPath(); g.arc(C[0], C[1], R * .4, 0, Math.PI * 2); g.fillStyle = rg; g.fill();
  }

  // 면 경계선
  g.strokeStyle = 'rgba(255,255,255,.28)'; g.lineWidth = Math.max(1, R * .03);
  for (let i = 0; i < P.length; i++) { g.beginPath(); g.moveTo(...P[i]); g.lineTo(...I[i]); g.stroke(); }
  path(g, I); g.stroke();
  // 테두리
  g.lineJoin = 'round'; g.strokeStyle = col.edge; g.lineWidth = Math.max(1.5, R * .07);
  path(g, P); g.stroke();
  // 반짝임
  g.save(); g.globalAlpha = .85; g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(C[0] - R * .2, C[1] - R * .2 + (t === 1 ? R * .1 : 0), R * .13, R * .055, -Math.PI / 4, 0, Math.PI * 2); g.fill();
  g.globalAlpha = .6;
  g.beginPath(); g.arc(C[0] + R * .02, C[1] - R * .32 + (t === 1 ? R * .12 : 0), R * .035, 0, Math.PI * 2); g.fill();
  g.restore();
}

function buildSprites() {
  const px = Math.ceil(S * dpr);
  sprites = COLORS.map((_, t) => {
    const c = document.createElement('canvas'); c.width = c.height = px;
    drawGem(c.getContext('2d'), t, px / 2, px / 2, px * .4);
    return c;
  });
}
function resize() {
  W = cv.clientWidth || 480; dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(W * dpr); S = W / N; buildSprites();
}
new ResizeObserver(resize).observe(cv);
resize();

/* ---------- 판 로직 ---------- */
const rnd = n => Math.floor(Math.random() * n);
const gem = (t, r, c, y) => ({t, r, c, x: c, y: y ?? r, vy: 0, s: 1, falling: y != null && y < r});
const types = () => grid.map(row => row.map(g => g ? g.t : -1));

function matchAt(t, r, c) {
  const v = t[r][c]; if (v < 0) return false;
  let n = 1; for (let k = c - 1; k >= 0 && t[r][k] === v; k--) n++; for (let k = c + 1; k < N && t[r][k] === v; k++) n++;
  if (n >= 3) return true;
  n = 1; for (let k = r - 1; k >= 0 && t[k][c] === v; k--) n++; for (let k = r + 1; k < N && t[k][c] === v; k++) n++;
  if (n >= 3) return true;
  // (r,c)를 포함하는 2×2 네 가지 위치
  for (const [dr, dc] of [[0, 0], [-1, 0], [0, -1], [-1, -1]]) if (squareAt(t, r + dr, c + dc)) return true;
  return false;
}
// (r,c)를 왼쪽 위로 하는 2×2가 같은 보석인지
function squareAt(t, r, c) {
  if (r < 0 || c < 0 || r + 1 >= N || c + 1 >= N) return false;
  const v = t[r][c];
  return v >= 0 && t[r][c + 1] === v && t[r + 1][c] === v && t[r + 1][c + 1] === v;
}
function findHint() {
  const t = types();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {
    const r2 = r + dr, c2 = c + dc; if (r2 >= N || c2 >= N) continue;
    [t[r][c], t[r2][c2]] = [t[r2][c2], t[r][c]];
    const ok = matchAt(t, r, c) || matchAt(t, r2, c2);
    [t[r][c], t[r2][c2]] = [t[r2][c2], t[r][c]];
    if (ok) return [{r, c}, {r: r2, c: c2}];
  }
  return null;
}
function findMatches() {
  const t = types(), cells = new Set(), groups = [];
  const scan = (get, isRow) => {
    for (let a = 0; a < N; a++) {
      let run = 1;
      for (let b = 1; b <= N; b++) {
        if (b < N && get(a, b) >= 0 && get(a, b) === get(a, b - 1)) { run++; continue; }
        if (run >= 3) {
          const grp = [];
          for (let k = b - run; k < b; k++) { const [r, c] = isRow ? [a, k] : [k, a]; cells.add(r * N + c); grp.push([r, c]); }
          groups.push(grp);
        }
        run = 1;
      }
    }
  };
  scan((r, c) => t[r][c], true);
  scan((c, r) => t[r][c], false);
  // 2×2 정사각형
  for (let r = 0; r < N - 1; r++) for (let c = 0; c < N - 1; c++) {
    if (!squareAt(t, r, c)) continue;
    const grp = [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]];
    grp.forEach(([a, b]) => cells.add(a * N + b));
    groups.push(grp);
  }
  return {cells, groups};
}
function randomTypes() {
  let t;
  do {
    t = [];
    for (let r = 0; r < N; r++) {
      t.push([]);
      for (let c = 0; c < N; c++) {
        let v;
        do { v = rnd(T); } while ((c >= 2 && t[r][c - 1] === v && t[r][c - 2] === v) || (r >= 2 && t[r - 1][c] === v && t[r - 2][c] === v) ||
                 (r >= 1 && c >= 1 && t[r - 1][c] === v && t[r][c - 1] === v && t[r - 1][c - 1] === v));
        t[r].push(v);
      }
    }
    grid = t.map((row, r) => row.map((v, c) => gem(v, r, c)));
  } while (!findHint());
  return t;
}
function dropIn(t) {
  grid = t.map((row, r) => row.map((v, c) => { const g = gem(v, r, c, r - N - .3 - c * .12); return g; }));
}

/* ---------- 애니메이션 ---------- */
const settled = () => dying.length === 0 && grid.every(row => row.every(g => !g || (g.x === g.c && g.y === g.r)));
const settle = () => new Promise(res => settled() ? res() : waiters.push(res));
const wait = ms => new Promise(res => setTimeout(res, ms));

let last = performance.now(), landedSfx = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  let landed = false;
  for (const row of grid) for (const g of row) {
    if (!g) continue;
    if (g.x !== g.c) { const d = g.c - g.x, st = 7 * dt; g.x = Math.abs(d) <= st ? g.c : g.x + Math.sign(d) * st; }
    if (g.y !== g.r) {
      if (g.falling && g.y < g.r) {
        g.vy += 55 * dt; g.y = Math.min(g.r, g.y + g.vy * dt);
        if (g.y === g.r) { g.vy = 0; g.falling = false; landed = true; }
      } else { const d = g.r - g.y, st = 7 * dt; g.y = Math.abs(d) <= st ? g.r : g.y + Math.sign(d) * st; }
    } else g.falling = false;
  }
  if (landed && now - landedSfx > 90) { landedSfx = now; tone(140 + Math.random() * 40, .05, 'sine', .05); }
  for (const g of dying) g.s -= dt * 6;
  dying = dying.filter(g => g.s > 0);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 14 * dt; p.life -= dt * 1.6; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floats) { f.y -= dt * .9; f.life -= dt * 1.1; }
  floats = floats.filter(f => f.life > 0);

  if (!busy && !over) { idle += dt; if (idle > 7 && !hint) hint = findHint(); }

  draw(now);
  if (waiters.length && settled()) { const w = waiters; waiters = []; w.forEach(f => f()); }
  requestAnimationFrame(frame);
}

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, W);
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = (r + c) % 2 ? '#1a1730' : '#211d3b';
    rr(c * S + 1.5, r * S + 1.5, S - 3, S - 3, S * .14); ctx.fill();
  }
  if (sel) {
    ctx.fillStyle = 'rgba(255,207,61,.18)'; rr(sel.c * S + 1.5, sel.r * S + 1.5, S - 3, S - 3, S * .14); ctx.fill();
    ctx.strokeStyle = '#ffcf3d'; ctx.lineWidth = 2.5; rr(sel.c * S + 3, sel.r * S + 3, S - 6, S - 6, S * .12); ctx.stroke();
  }
  if (hint && !busy) {
    const a = .35 + .35 * Math.sin(now / 160);
    ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 3;
    for (const h of hint) { rr(h.c * S + 4, h.r * S + 4, S - 8, S - 8, S * .12); ctx.stroke(); }
  }
  if (kb) {
    ctx.strokeStyle = '#8fd3ff'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    rr(kb.c * S + 5, kb.r * S + 5, S - 10, S - 10, S * .1); ctx.stroke(); ctx.setLineDash([]);
  }

  ctx.save(); rr(0, 0, W, W, 14); ctx.clip();
  const drawOne = (g, scale) => {
    const sz = S * scale, cx = (g.x + .5) * S, cy = (g.y + .5) * S;
    if (cy < -S) return;
    ctx.drawImage(sprites[g.t], cx - sz / 2, cy - sz / 2, sz, sz);
  };
  for (const row of grid) for (const g of row) {
    if (!g) continue;
    const isSel = sel && sel.r === g.r && sel.c === g.c && g.x === g.c && g.y === g.r;
    drawOne(g, isSel ? 1.06 + .05 * Math.sin(now / 110) : 1);
  }
  for (const g of dying) { ctx.globalAlpha = Math.max(0, g.s); drawOne(g, 1 + (1 - g.s) * .5); }
  ctx.globalAlpha = 1;
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x * S, p.y * S, p.size * S * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.font = `${Math.round(S * .42)}px Jua, "Malgun Gothic", sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,40,.9)'; ctx.strokeText(f.text, f.x * S, f.y * S);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x * S, f.y * S);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function burst(g) {
  const col = COLORS[g.t];
  for (let i = 0; i < 9; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3;
    particles.push({x: g.c + .5, y: g.r + .5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
      life: 1, size: .05 + Math.random() * .05, color: i % 3 ? col.light : col.mid});
  }
}

/* ---------- 게임 흐름 ---------- */
function swapCells(a, b) {
  const ga = grid[a.r][a.c], gb = grid[b.r][b.c];
  grid[a.r][a.c] = gb; grid[b.r][b.c] = ga;
  ga.r = b.r; ga.c = b.c; gb.r = a.r; gb.c = a.c;
  ga.falling = gb.falling = false;
}
async function doSwap(a, b) {
  if (busy || over) return;
  busy = true; hint = null; idle = 0; sel = null;
  tone(420, .06, 'sine', .06);
  swapCells(a, b); await settle();
  if (!findMatches().cells.size) {
    tone(170, .14, 'square', .04);
    swapCells(a, b); await settle();
    busy = false; return;
  }
  moves--; hud();
  await resolve();
  busy = false; idle = 0;
  if (moves <= 0) gameOver();
}
function collapse() {
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const g = grid[r][c];
      if (g) { if (r !== w) { grid[w][c] = g; grid[r][c] = null; g.r = w; g.falling = true; g.vy = 0; } w--; }
    }
    for (let r = w; r >= 0; r--) grid[r][c] = gem(rnd(T), r, c, r - (w + 1) - .2);
  }
}
async function resolve() {
  let combo = 0;
  for (;;) {
    const {cells, groups} = findMatches();
    if (!cells.size) break;
    combo++;
    let gain = 0;
    for (const grp of groups) {
      const n = grp.length;
      let p = n * 10 + (n === 4 ? 40 : n >= 5 ? 120 : 0);
      p *= combo; gain += p;
      const cx = grp.reduce((s, [, c]) => s + c, 0) / n + .5, cy = grp.reduce((s, [r]) => s + r, 0) / n + .5;
      floats.push({x: cx, y: cy, text: '+' + p, life: 1, color: n >= 4 ? '#ffcf3d' : '#ffffff'});
    }
    score += gain; hud();
    if (combo >= 2) showCombo(combo);
    const base = 520 * Math.pow(1.122, Math.min(combo, 8) - 1);
    tone(base, .18, 'triangle', .12); tone(base * 1.5, .22, 'sine', .07, .05);
    for (const k of cells) {
      const r = Math.floor(k / N), c = k % N, g = grid[r][c];
      if (!g) continue;
      dying.push(g); burst(g); grid[r][c] = null;
    }
    await wait(160);
    collapse();
    await settle();
  }
  if (!findHint()) await reshuffle();
}
async function reshuffle() {
  floats.push({x: N / 2, y: N / 2, text: '더 맞출 수 없어 섞는 중', life: 1.4, color: '#8fd3ff'});
  await wait(500);
  for (const row of grid) for (const g of row) { if (g) dying.push(g); }
  grid = grid.map(row => row.map(() => null));
  await settle();
  dropIn(randomTypes());
  await settle();
}
function showCombo(n) {
  const el = $('combo'); el.textContent = `콤보 ×${n}!`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function hud() {
  $('score').textContent = score.toLocaleString('ko-KR');
  $('moves').textContent = moves;
  $('best').textContent = Math.max(best, score).toLocaleString('ko-KR');
  $('movesBox').classList.toggle('low', moves <= 5);
}
function gameOver() {
  over = true;
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('gemmine-best', String(best)); } catch (e) {} }
  $('finalScore').textContent = score.toLocaleString('ko-KR');
  $('finalMsg').textContent = isBest ? '새 최고 기록이에요!' : `최고 기록 ${best.toLocaleString('ko-KR')}점`;
  $('over').hidden = false;
  if (isBest) [0, .12, .24].forEach((d, i) => tone(660 * [1, 1.26, 1.5][i], .3, 'triangle', .1, d));
}
async function newGame() {
  over = false; $('over').hidden = true;
  score = 0; moves = START_MOVES; sel = null; hint = null; idle = 0; dying = []; particles = []; floats = [];
  hud();
  busy = true;
  dropIn(randomTypes());
  await settle();
  busy = false;
}

/* ---------- 소리 ---------- */
let ac = null, soundOn = true;
function initAudio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    else if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(freq, dur, type = 'sine', vol = .1, when = 0) {
  if (!ac || !soundOn) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + when;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) {}
}

/* ---------- 입력 ---------- */
let down = null;
const adj = (a, b) => Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
function cellAt(e) {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const c = Math.floor(x / (rect.width / N)), r = Math.floor(y / (rect.height / N));
  return r >= 0 && r < N && c >= 0 && c < N ? {r, c, x, y} : null;
}
cv.addEventListener('pointerdown', e => {
  initAudio(); kb = null;
  if (busy || over) return;
  const p = cellAt(e); if (!p) return;
  idle = 0; hint = null;
  if (sel && adj(sel, p)) { doSwap(sel, p); down = null; return; }
  sel = (sel && sel.r === p.r && sel.c === p.c) ? null : {r: p.r, c: p.c};
  down = p;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!down || busy || over) return;
  const rect = cv.getBoundingClientRect(), cell = rect.width / N;
  const dx = e.clientX - rect.left - down.x, dy = e.clientY - rect.top - down.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * .35) return;
  const t = Math.abs(dx) > Math.abs(dy) ? {r: down.r, c: down.c + Math.sign(dx)} : {r: down.r + Math.sign(dy), c: down.c};
  const from = {r: down.r, c: down.c}; down = null;
  if (t.r >= 0 && t.r < N && t.c >= 0 && t.c < N) doSwap(from, t);
});
cv.addEventListener('pointerup', () => { down = null; });
cv.addEventListener('pointercancel', () => { down = null; });

cv.addEventListener('keydown', e => {
  const dirs = {ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1]};
  if (!kb) kb = {r: 3, c: 3};
  if (dirs[e.key]) {
    e.preventDefault();
    const [dr, dc] = dirs[e.key];
    const t = {r: Math.max(0, Math.min(N - 1, kb.r + dr)), c: Math.max(0, Math.min(N - 1, kb.c + dc))};
    if (sel && !busy && !over && adj(sel, t)) { initAudio(); doSwap(sel, t); }
    kb = t;
  } else if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); initAudio();
    if (busy || over) return;
    sel = (sel && sel.r === kb.r && sel.c === kb.c) ? null : {...kb};
  } else if (e.key === 'Escape') sel = null;
});

$('hintBtn').addEventListener('click', () => { initAudio(); if (!busy && !over) { hint = findHint(); tone(880, .1, 'sine', .05); } });
$('newBtn').addEventListener('click', () => { initAudio(); if (!busy) newGame(); });
$('againBtn').addEventListener('click', () => { initAudio(); newGame(); });
$('soundBtn').addEventListener('click', e => {
  soundOn = !soundOn; initAudio();
  e.currentTarget.textContent = soundOn ? '소리 켜짐' : '소리 꺼짐';
  e.currentTarget.setAttribute('aria-pressed', String(soundOn));
});

/* ---------- 시작 ---------- */
function start(data) {
  if (data && Array.isArray(data.types) && data.types.length === N && !data.over) {
    grid = data.types.map((row, r) => row.map((v, c) => gem(v, r, c)));
    score = data.score || 0; moves = data.moves ?? START_MOVES; hud();
  } else newGame();
  hud();
  requestAnimationFrame(t => { last = t; frame(t); });
}
try { window.claude?.hot?.snapshot?.(() => ({types: types(), score, moves, over})); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
